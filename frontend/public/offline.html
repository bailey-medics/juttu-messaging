<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#001a36" />
    <title>Juttu is offline</title>
    <!-- Everything this page needs is in this file, because the network it
         would fetch the rest from is the thing that is missing. -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        font-size: 1.1875rem;
        line-height: 1.5;
        color: #1a1b1e;
        background: #ffffff;
      }
      main {
        max-width: 32rem;
        padding: 1.5rem;
      }
      h1 {
        font-size: 2rem;
        color: #001a36;
      }
      button {
        font: inherit;
        padding: 0.75rem 1.25rem;
        min-height: 44px;
        border: 0;
        border-radius: 0.5rem;
        color: #ffffff;
        background: #001a36;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Juttu is offline</h1>
      <p>This phone or computer cannot reach Juttu right now.</p>
      <p>Check the connection, then try again. Nothing you have sent is lost.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
