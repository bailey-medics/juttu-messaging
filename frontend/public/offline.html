<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#001a36" />
    <title>Juttu is offline</title>
    <!-- Everything this page needs is in this file, because the network it
         would fetch the rest from is the thing that is missing. -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        font-size: 1.1875rem;
        line-height: 1.5;
        color: #1a1b1e;
        background: #ffffff;
      }
      main {
        max-width: 32rem;
        padding: 1.5rem;
      }
      .icon {
        display: block;
        width: 4.5rem;
        height: 4.5rem;
      }
      h1 {
        font-size: 2rem;
        color: #001a36;
      }
      button {
        font: inherit;
        padding: 0.75rem 1.25rem;
        min-height: 44px;
        border: 0;
        border-radius: 0.5rem;
        color: #ffffff;
        background: #001a36;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Juttu's icon, public/juttu-icon-transparent.svg, copied in. -->
      <svg class="icon" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
        <path
          fill="#C8963E"
          d="M204 104H308A100 100 0 0 1 408 204V248A100 100 0 0 1 308 348H234Q200 390 142 408Q158 364 127.4 312.3A100 100 0 0 1 104 248V204A100 100 0 0 1 204 104Z"
        />
        <path
          fill="#001a36"
          d="M259 222A23 23 0 0 1 305 222V262A63 63 0 0 1 242 325H224A23 23 0 0 1 224 279H242A17 17 0 0 0 259 262Z"
        />
        <circle fill="#001a36" cx="282" cy="154" r="27" />
      </svg>
      <h1>Juttu is offline</h1>
      <p>This phone or computer cannot reach Juttu right now.</p>
      <p>Check the connection, then try again. Nothing you have sent is lost.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
